name: CI - Test & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # TEST BACKEND
  
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 
          MYSQL_DATABASE: ecommerce
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Setup Database
        run: |
          mysql -h 127.0.0.1 -u root -ptestpass ecommerce_test < database/schema.sql

      - name: Run Backend Tests
        working-directory: ./backend
        run: npm test --if-present || echo "No tests configured"
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: 
          DB_NAME: ecommerce
          JWT_SECRET: test_secret_key
          JWT_EXPIRES_IN: 1h
          PORT: 5000


  # BUILD FRONTEND
  
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Verify Build
        run: |
          if [ -d "frontend/dist" ]; then
            echo "Frontend build successful"
          else
            echo "Build failed"
            exit 1
          fi